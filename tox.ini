[tox]
min_version = 4.0
envlist = black,isort,flake8,bandit,py39
skip_missing_interpreters = true

[testenv]
description = Run pytest with coverage
deps =
    -r requirements.txt
    -r requirements-dev.txt
commands =
    pytest {posargs:--cov --cov-report=term-missing --cov-report=html}

[testenv:black]
description = Check formatting with black
skip_install = true
deps = black>=23.0.0
commands = black --check --diff .

[testenv:isort]
description = Check import ordering with isort
skip_install = true
deps = isort>=5.12.0
commands = isort --check-only --diff .

[testenv:flake8]
description = Lint with flake8
skip_install = true
deps = flake8>=6.0.0
commands = flake8 .

[testenv:bandit]
description = Security scan with bandit
skip_install = true
deps = bandit>=1.7.0
commands = bandit -r .

[testenv:lint]
description = Run all linters
skip_install = true
deps =
    black>=23.0.0
    isort>=5.12.0
    flake8>=6.0.0
    bandit>=1.7.0
commands =
    black --check --diff .
    isort --check-only --diff .
    flake8 .
    bandit -r .

[testenv:format]
description = Auto-format code
skip_install = true
deps =
    black>=23.0.0
    isort>=5.12.0
commands =
    black .
    isort .
